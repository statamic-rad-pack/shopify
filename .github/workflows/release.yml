name: Bundle Release Assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without the v prefix (e.g. 7.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like 7.1.0 (got: $INPUT_VERSION)"
            exit 1
          fi

          echo "TAG=v$INPUT_VERSION" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Assert tag does not already exist
        run: |
          existing="$(git ls-remote --tags origin "$TAG")"
          [ -z "$existing" ] || { echo "::error::Tag $TAG already exists on remote. Aborting."; exit 1; }

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Use Node.js 23.3.0
        uses: actions/setup-node@v4
        with:
          node-version: 23.3.0

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install node dependencies
        run: npm ci

      - name: Build release assets
        run: npm run build

      - name: Create zip
        run: tar -czvf dist.tar.gz dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist.tar.gz \
            --title "$TAG" \
            --generate-notes
